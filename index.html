<!DOCTYPE html>

<html lang="si">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DriveLink SL | Luxury Vehicle & Chauffeur Network</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root {

--bg-void: #05070d;

--bg-obsidian: #0a0f1d;

--bg-surface: #111827;

--bg-surface-2: #162033;

--border-subtle: rgba(255, 255, 255, 0.08);

--border-gold: rgba(217, 160, 54, 0.35);

--gold-bright: #f5b942;

--gold-rich: #d99b26;

--bronze: #b87333;

--text-main: #f8fafc;

--text-soft: #cbd5e1;

--text-muted: #94a3b8;

--radius-xl: 22px;

--radius-lg: 16px;

--radius-md: 12px;

--glow-gold: 0 20px 50px rgba(217, 155, 38, 0.16);

}



*, *::before, *::after {

margin: 0;

padding: 0;

box-sizing: border-box;

}



html {

scroll-behavior: smooth;

font-family: 'Plus Jakarta Sans', 'Noto Sans Sinhala', system-ui, sans-serif;

background: var(--bg-void);

color: var(--text-main);

}



body {

background: var(--bg-void);

color: var(--text-main);

line-height: 1.65;

overflow-x: hidden;

}



.container {

width: 100%;

max-width: 1240px;

margin: 0 auto;

padding: 0 22px;

}



/* Ambient Luxury Grid Overlay */

.bg-grid-pattern {

background-image:

radial-gradient(circle at 18% 12%, rgba(245, 185, 66, 0.12), transparent 36%),

radial-gradient(circle at 85% 28%, rgba(184, 115, 51, 0.12), transparent 40%),

linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),

linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);

background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;

}



/* Parent Page Sub-Navigation Bar (New Anura Stores / careers-apply.html) */

.parent-sub-bar {

background: rgba(8, 12, 22, 0.95);

border-bottom: 1px solid rgba(245, 185, 66, 0.22);

font-size: 0.78rem;

color: var(--text-muted);

}



.parent-sub-inner {

min-height: 38px;

display: flex;

align-items: center;

justify-content: space-between;

gap: 12px;

flex-wrap: wrap;

padding: 6px 0;

}



.parent-crumb-trail {

display: inline-flex;

align-items: center;

gap: 7px;

flex-wrap: wrap;

}



.parent-crumb-trail a {

color: var(--gold-bright);

text-decoration: none;

font-weight: 700;

}



.parent-crumb-trail a:hover {

text-decoration: underline;

}



.parent-back-link {

color: var(--text-soft);

text-decoration: none;

font-weight: 600;

font-size: 0.76rem;

}



.parent-back-link:hover {

color: var(--gold-bright);

}



/* Navbar */

.navbar {

position: fixed;

top: 38px;

left: 0;

width: 100%;

z-index: 1000;

background: rgba(5, 7, 13, 0.86);

backdrop-filter: blur(18px);

-webkit-backdrop-filter: blur(18px);

border-bottom: 1px solid var(--border-subtle);

}



.nav-inner {

height: 78px;

display: flex;

align-items: center;

justify-content: space-between;

gap: 16px;

}



.brand {

display: inline-flex;

align-items: center;

gap: 12px;

text-decoration: none;

}



.brand-logo-wrap {

width: 46px;

height: 46px;

border-radius: 12px;

padding: 2px;

background: linear-gradient(135deg, var(--gold-bright), var(--bronze));

display: flex;

align-items: center;

justify-content: center;

flex-shrink: 0;

}



.brand-logo {

width: 100%;

height: 100%;

object-fit: cover;

border-radius: 10px;

background: #0b0f19;

}



.brand-fallback-icon {

font-family: 'Cinzel', serif;

font-weight: 800;

font-size: 1rem;

color: var(--gold-bright);

}



.brand-text {

display: flex;

flex-direction: column;

line-height: 1.15;

}



.brand-name {

font-size: 1.3rem;

font-weight: 800;

color: #ffffff;

letter-spacing: -0.02em;

}



.brand-name span {

background: linear-gradient(90deg, var(--gold-bright), #fbbf24);

-webkit-background-clip: text;

-webkit-text-fill-color: transparent;

}



.brand-sub {

font-size: 0.62rem;

font-weight: 700;

letter-spacing: 0.16em;

color: var(--text-muted);

}



.nav-menu {

display: flex;

align-items: center;

gap: 26px;

}



.nav-menu a {

color: var(--text-soft);

text-decoration: none;

font-size: 0.9rem;

font-weight: 600;

transition: color 0.2s ease;

}



.nav-menu a:hover {

color: var(--gold-bright);

}



.nav-actions {

display: flex;

align-items: center;

gap: 10px;

}



/* Buttons */

.btn {

display: inline-flex;

align-items: center;

justify-content: center;

gap: 8px;

border: none;

border-radius: 11px;

padding: 13px 22px;

font-size: 0.92rem;

font-weight: 700;

cursor: pointer;

transition: all 0.25s ease;

font-family: inherit;

text-decoration: none;

}



.btn:hover {

transform: translateY(-2px);

}



.btn-gold {

background: linear-gradient(135deg, #f5b942 0%, #d98a1c 100%);

color: #080b12;

box-shadow: 0 10px 28px rgba(245, 185, 66, 0.28);

}



.btn-gold:hover {

box-shadow: 0 14px 34px rgba(245, 185, 66, 0.42);

filter: brightness(1.05);

}



.btn-glass {

background: rgba(255, 255, 255, 0.06);

color: #ffffff;

border: 1px solid rgba(255, 255, 255, 0.14);

}



.btn-glass:hover {

background: rgba(245, 185, 66, 0.14);

border-color: var(--gold-bright);

color: var(--gold-bright);

}



.btn-sm {

padding: 9px 15px;

font-size: 0.82rem;

}



.full-btn {

width: 100%;

}



.hamburger {

display: none;

background: rgba(255, 255, 255, 0.06);

border: 1px solid rgba(255, 255, 255, 0.16);

color: #ffffff;

width: 40px;

height: 40px;

border-radius: 10px;

font-size: 1.2rem;

cursor: pointer;

}



/* Hero Section */

.hero {

position: relative;

padding: 158px 0 84px;

min-height: 100vh;

display: flex;

align-items: center;

border-bottom: 1px solid var(--border-subtle);

}



.hero-grid {

display: grid;

grid-template-columns: 1.15fr 0.95fr;

gap: 44px;

align-items: center;

}



.luxury-badge {

display: inline-flex;

align-items: center;

gap: 10px;

padding: 7px 16px;

border-radius: 999px;

background: rgba(245, 185, 66, 0.1);

border: 1px solid var(--border-gold);

color: var(--gold-bright);

font-size: 0.8rem;

font-weight: 700;

margin-bottom: 20px;

}



.badge-dot {

width: 8px;

height: 8px;

border-radius: 50%;

background: var(--gold-bright);

box-shadow: 0 0 12px var(--gold-bright);

}



.hero-copy h1 {

font-size: clamp(2.1rem, 4.3vw, 3.35rem);

font-weight: 800;

line-height: 1.18;

letter-spacing: -0.025em;

margin-bottom: 18px;

color: #ffffff;

}



.hero-copy h1 span {

background: linear-gradient(90deg, #fde68a 0%, #f5b942 50%, #d98a1c 100%);

-webkit-background-clip: text;

-webkit-text-fill-color: transparent;

}



.hero-desc {

color: var(--text-soft);

font-size: 1.03rem;

max-width: 580px;

margin-bottom: 28px;

}



/* Visual Showcase Strip inside Hero */

.hero-showcase-banner {

position: relative;

border-radius: var(--radius-lg);

padding: 18px 22px;

margin-bottom: 26px;

background: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(10, 15, 29, 0.95));

border: 1px solid var(--border-gold);

display: flex;

align-items: center;

justify-content: space-between;

gap: 16px;

box-shadow: var(--glow-gold);

}



.hero-car-art {

width: 210px;

flex-shrink: 0;

}



.hero-stats-row {

display: grid;

grid-template-columns: repeat(3, 1fr);

gap: 14px;

}



.stat-pill {

background: rgba(255, 255, 255, 0.035);

border: 1px solid var(--border-subtle);

border-radius: 14px;

padding: 14px 16px;

}



.stat-pill strong {

display: block;

font-size: 1.35rem;

font-weight: 800;

color: var(--gold-bright);

}



.stat-pill span {

font-size: 0.78rem;

color: var(--text-muted);

}



/* Dark Glass Booking Card */

.booking-card {

background: linear-gradient(160deg, rgba(17, 24, 39, 0.96) 0%, rgba(9, 13, 24, 0.98) 100%);

border: 1px solid var(--border-gold);

border-radius: var(--radius-xl);

padding: 28px;

box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), var(--glow-gold);

}



.card-eyebrow {

display: inline-block;

font-size: 0.7rem;

font-weight: 800;

letter-spacing: 0.14em;

color: var(--gold-bright);

background: rgba(245, 185, 66, 0.12);

padding: 4px 10px;

border-radius: 6px;

margin-bottom: 10px;

}



.booking-card h2 {

font-size: 1.42rem;

font-weight: 800;

color: #ffffff;

margin-bottom: 4px;

}



.booking-card > p {

font-size: 0.86rem;

color: var(--text-muted);

margin-bottom: 18px;

}



.mode-tabs {

display: grid;

grid-template-columns: repeat(3, 1fr);

gap: 6px;

background: rgba(5, 7, 13, 0.8);

border: 1px solid var(--border-subtle);

padding: 6px;

border-radius: 12px;

margin-bottom: 18px;

}



.mode-btn {

border: none;

background: transparent;

color: var(--text-muted);

padding: 10px 6px;

border-radius: 9px;

font-size: 0.77rem;

font-weight: 700;

cursor: pointer;

transition: all 0.2s ease;

font-family: inherit;

}



.mode-btn.active {

background: linear-gradient(135deg, #f5b942, #d98a1c);

color: #080b12;

}



.dark-form {

display: flex;

flex-direction: column;

gap: 14px;

}



.field-row {

display: grid;

grid-template-columns: 1fr 1fr;

gap: 12px;

}



.field {

display: flex;

flex-direction: column;

gap: 6px;

}



.field label {

font-size: 0.79rem;

font-weight: 600;

color: var(--text-soft);

}



.field input,

.field select {

width: 100%;

padding: 11px 13px;

border-radius: 10px;

border: 1px solid rgba(255, 255, 255, 0.12);

background: rgba(5, 7, 13, 0.85);

color: #ffffff;

font-size: 0.9rem;

font-family: inherit;

transition: border-color 0.2s ease;

}



.field input::placeholder {

color: #64748b;

}



.field input:focus,

.field select:focus {

outline: none;

border-color: var(--gold-bright);

}



.price-banner {

display: flex;

align-items: center;

justify-content: space-between;

padding: 12px 15px;

border-radius: 11px;

background: rgba(245, 185, 66, 0.08);

border: 1px dashed var(--border-gold);

font-size: 0.85rem;

color: var(--text-soft);

}



.price-banner strong {

font-size: 1.15rem;

color: var(--gold-bright);

}



/* Sections */

.section {

padding: 92px 0;

border-bottom: 1px solid var(--border-subtle);

}



.section-darker {

background: var(--bg-obsidian);

}



.section-head {

text-align: center;

max-width: 690px;

margin: 0 auto 52px;

}



.section-head .eyebrow {

display: inline-block;

font-size: 0.74rem;

font-weight: 800;

letter-spacing: 0.16em;

color: var(--gold-bright);

margin-bottom: 8px;

}



.section-head h2 {

font-size: clamp(1.7rem, 3.1vw, 2.35rem);

font-weight: 800;

color: #ffffff;

margin-bottom: 10px;

}



.section-head p {

color: var(--text-muted);

font-size: 0.96rem;

}



/* 3 Core Pillars */

.pillars-grid {

display: grid;

grid-template-columns: repeat(3, 1fr);

gap: 26px;

}



.payments-grid-4 {

grid-template-columns: repeat(4, 1fr);

gap: 20px;

}



.pillar-card {

background: linear-gradient(180deg, rgba(17, 24, 39, 0.9) 0%, rgba(10, 15, 29, 0.95) 100%);

border: 1px solid var(--border-subtle);

border-radius: var(--radius-xl);

padding: 32px 26px;

display: flex;

flex-direction: column;

justify-content: space-between;

transition: transform 0.25s ease, border-color 0.25s ease;

}



.pillar-card:hover {

transform: translateY(-5px);

border-color: var(--border-gold);

}



.pillar-card.featured {

border: 1.5px solid var(--gold-bright);

box-shadow: var(--glow-gold);

}



.pillar-icon-box {

width: 52px;

height: 52px;

border-radius: 14px;

background: rgba(245, 185, 66, 0.12);

border: 1px solid var(--border-gold);

display: flex;

align-items: center;

justify-content: center;

font-size: 1.5rem;

margin-bottom: 18px;

}



.pillar-card h3 {

font-size: 1.22rem;

color: #ffffff;

margin-bottom: 10px;

}



.pillar-card > div > p {

font-size: 0.9rem;

color: var(--text-muted);

}



.pillar-list {

list-style: none;

margin: 20px 0 26px;

display: flex;

flex-direction: column;

gap: 10px;

}



.pillar-list li {

font-size: 0.88rem;

color: var(--text-soft);

display: flex;

align-items: center;

gap: 8px;

}



.pillar-list li span {

color: var(--gold-bright);

font-weight: 800;

}



/* Fleet Cards with Custom Vector Illustrations */

.fleet-header {

display: flex;

align-items: flex-end;

justify-content: space-between;

gap: 20px;

flex-wrap: wrap;

margin-bottom: 38px;

}



.fleet-header .section-head {

text-align: left;

margin: 0;

}



.filter-bar {

display: flex;

gap: 8px;

flex-wrap: wrap;

}



.filter-btn {

background: rgba(255, 255, 255, 0.04);

border: 1px solid var(--border-subtle);

color: var(--text-soft);

padding: 9px 16px;

border-radius: 999px;

font-size: 0.82rem;

font-weight: 700;

cursor: pointer;

transition: all 0.2s ease;

font-family: inherit;

}



.filter-btn.active,

.filter-btn:hover {

background: var(--gold-bright);

color: #080b12;

border-color: var(--gold-bright);

}



.fleet-grid {

display: grid;

grid-template-columns: repeat(3, 1fr);

gap: 26px;

}



.vehicle-card {

background: var(--bg-surface);

border: 1px solid var(--border-subtle);

border-radius: var(--radius-xl);

overflow: hidden;

display: flex;

flex-direction: column;

transition: transform 0.25s ease, border-color 0.25s ease;

}



.vehicle-card:hover {

transform: translateY(-5px);

border-color: var(--border-gold);

}



.vehicle-visual {

position: relative;

height: 200px;

background: radial-gradient(circle at 50% 45%, rgba(245, 185, 66, 0.18), rgba(5, 7, 13, 0.98) 75%);

display: flex;

align-items: center;

justify-content: center;

padding: 20px;

border-bottom: 1px solid var(--border-subtle);

}



.vehicle-visual svg {

width: 84%;

max-width: 260px;

height: auto;

filter: drop-shadow(0 14px 18px rgba(0,0,0,0.65));

}



.v-badge {

position: absolute;

top: 14px;

left: 14px;

background: rgba(5, 7, 13, 0.85);

border: 1px solid var(--border-gold);

color: var(--gold-bright);

font-size: 0.72rem;

font-weight: 700;

padding: 4px 11px;

border-radius: 999px;

}



.vehicle-body {

padding: 22px;

display: flex;

flex-direction: column;

justify-content: space-between;

flex: 1;

}



.vehicle-body h3 {

font-size: 1.15rem;

color: #ffffff;

margin-bottom: 6px;

}



.vehicle-specs {

font-size: 0.84rem;

color: var(--text-muted);

margin-bottom: 18px;

}



.vehicle-footer {

display: flex;

align-items: center;

justify-content: space-between;

padding-top: 14px;

border-top: 1px solid var(--border-subtle);

}



.vehicle-footer small {

display: block;

font-size: 0.72rem;

color: var(--text-muted);

}



.vehicle-footer strong {

font-size: 1.18rem;

color: var(--gold-bright);

}



/* Commission Simulator */

.calc-wrapper {

display: grid;

grid-template-columns: 1.1fr 0.9fr;

gap: 34px;

align-items: center;

}



.calc-left h2 {

font-size: clamp(1.6rem, 2.8vw, 2.2rem);

color: #ffffff;

margin-bottom: 12px;

}



.calc-left p {

color: var(--text-muted);

margin-bottom: 24px;

}



.calc-inputs {

display: grid;

grid-template-columns: 1fr 1fr;

gap: 16px;

}



.calc-card {

background: linear-gradient(155deg, #111827, #080c16);

border: 1px solid var(--border-gold);

border-radius: var(--radius-xl);

padding: 30px;

box-shadow: var(--glow-gold);

}



.calc-card h3 {

color: var(--gold-bright);

font-size: 1.15rem;

margin-bottom: 18px;

}



.calc-row {

display: flex;

justify-content: space-between;

align-items: center;

padding: 14px 0;

border-bottom: 1px solid var(--border-subtle);

font-size: 0.92rem;

color: var(--text-soft);

}



.calc-row strong {

font-size: 1.08rem;

}



.green-val {

color: #4ade80;

}



.gold-val {

color: var(--gold-bright);

}



.calc-disclaimer {

margin-top: 16px;

font-size: 0.78rem;

color: var(--text-muted);

}



/* Partner Registration */

.partner-grid {

display: grid;

grid-template-columns: 1fr 1fr;

gap: 28px;

}



.partner-card {

background: var(--bg-surface);

border: 1px solid var(--border-subtle);

border-radius: var(--radius-xl);

padding: 32px 28px;

}



.partner-card h3 {

font-size: 1.26rem;

color: #ffffff;

margin-bottom: 8px;

}



.partner-card > p {

font-size: 0.88rem;

color: var(--text-muted);

margin-bottom: 22px;

}



/* FAQ */

.faq-container {

max-width: 840px;

}



.faq-list {

display: flex;

flex-direction: column;

gap: 14px;

}



.faq-item {

background: var(--bg-surface);

border: 1px solid var(--border-subtle);

border-radius: var(--radius-md);

overflow: hidden;

}



.faq-btn {

width: 100%;

background: transparent;

border: none;

padding: 18px 22px;

text-align: left;

color: #ffffff;

font-size: 0.96rem;

font-weight: 700;

display: flex;

justify-content: space-between;

align-items: center;

gap: 14px;

cursor: pointer;

font-family: inherit;

}



.faq-body {

display: none;

padding: 0 22px 18px;

font-size: 0.9rem;

color: var(--text-muted);

}



.faq-item.open .faq-body {

display: block;

}



.faq-item.open .faq-plus {

transform: rotate(45deg);

}



.faq-plus {

color: var(--gold-bright);

font-size: 1.35rem;

transition: transform 0.2s ease;

}



/* Footer */

.footer {

background: #030509;

padding: 64px 0 26px;

}



.footer-grid {

display: grid;

grid-template-columns: 1.4fr 1fr 1fr;

gap: 34px;

padding-bottom: 36px;

border-bottom: 1px solid var(--border-subtle);

}



.footer-about p {

margin-top: 14px;

font-size: 0.88rem;

color: var(--text-muted);

max-width: 360px;

}



.footer h4 {

color: #ffffff;

font-size: 0.98rem;

margin-bottom: 14px;

}



.footer ul {

list-style: none;

display: flex;

flex-direction: column;

gap: 9px;

font-size: 0.88rem;

color: var(--text-muted);

}



.footer a {

color: var(--text-muted);

text-decoration: none;

}



.footer a:hover {

color: var(--gold-bright);

}



.footer-copy {

padding-top: 22px;

text-align: center;

font-size: 0.82rem;

color: #64748b;

}



/* Modal */

.modal-overlay {

display: none;

position: fixed;

inset: 0;

z-index: 1500;

background: rgba(2, 4, 10, 0.82);

backdrop-filter: blur(8px);

align-items: center;

justify-content: center;

padding: 20px;

}



.modal-overlay.show {

display: flex;

}



.modal-dialog {

position: relative;

width: 100%;

max-width: 470px;

background: var(--bg-surface);

border: 1px solid var(--border-gold);

border-radius: var(--radius-xl);

padding: 28px;

box-shadow: 0 30px 80px rgba(0,0,0,0.8);

}



.modal-x {

position: absolute;

top: 14px;

right: 18px;

background: transparent;

border: none;

color: var(--text-muted);

font-size: 1.6rem;

cursor: pointer;

}



.modal-tag {

margin: 10px 0 16px;

padding: 9px 12px;

border-radius: 9px;

background: rgba(245, 185, 66, 0.1);

border: 1px solid var(--border-gold);

color: var(--gold-bright);

font-size: 0.84rem;

font-weight: 700;

}





/* Live Availability Map Section */

.map-grid {

display: grid;

grid-template-columns: 1.35fr 0.85fr;

gap: 26px;

align-items: stretch;

}



.map-stage {

position: relative;

min-height: 430px;

border-radius: var(--radius-xl);

border: 1px solid var(--border-gold);

background:

radial-gradient(circle at 48% 52%, rgba(245, 185, 66, 0.14), transparent 55%),

linear-gradient(160deg, #0b1222 0%, #060913 100%);

overflow: hidden;

box-shadow: var(--glow-gold);

}



.map-road {

position: absolute;

background: rgba(255, 255, 255, 0.06);

border: 1px solid rgba(245, 185, 66, 0.12);

}
