<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveLink SL | Luxury Vehicle & Chauffeur Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #05070d;
            --bg-obsidian: #0a0f1d;
            --bg-surface: #111827;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(217, 160, 54, 0.35);
            --gold-bright: #f5b942;
            --bronze: #b87333;
            --text-main: #f8fafc;
            --text-soft: #cbd5e1;
            --text-muted: #94a3b8;
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --glow-gold: 0 20px 50px rgba(217, 155, 38, 0.16);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Sinhala', system-ui, sans-serif;
            background: var(--bg-void);
            color: var(--text-main);
        }

        body {
            background: var(--bg-void);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 22px;
        }

        .bg-grid-pattern {
            background-image:
                radial-gradient(circle at 18% 12%, rgba(245, 185, 66, 0.12), transparent 36%),
                radial-gradient(circle at 85% 28%, rgba(184, 115, 51, 0.12), transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
        }

        .parent-sub-bar {
            background: rgba(8, 12, 22, 0.96);
            border-bottom: 1px solid rgba(245, 185, 66, 0.25);
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .parent-sub-inner {
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 6px 0;
        }

        .parent-crumb-trail {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .parent-crumb-trail a {
            color: var(--gold-bright);
            text-decoration: none;
            font-weight: 700;
        }

        .parent-crumb-trail a:hover, .parent-back-link:hover {
            text-decoration: underline;
            color: var(--gold-bright);
        }

        .parent-back-link {
            color: var(--text-soft);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.76rem;
        }

        .navbar {
            position: fixed;
            top: 38px;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(5, 7, 13, 0.88);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .nav-inner {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold-bright), var(--bronze));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            color: #080b12;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
        }

        .brand-name span {
            color: var(--gold-bright);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-menu a {
            color: var(--text-soft);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .nav-menu a:hover {
            color: var(--gold-bright);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 11px;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-gold {
            background: linear-gradient(135deg, #f5b942 0%, #d98a1c 100%);
            color: #080b12;
            box-shadow: 0 10px 24px rgba(245, 185, 66, 0.25);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .btn-sm { padding: 9px 14px; font-size: 0.82rem; }
        .full-btn { width: 100%; }

        .hamburger {
            display: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .hero {
            padding: 156px 0 80px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.95fr;
            gap: 40px;
            align-items: center;
        }

        .luxury-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(245, 185, 66, 0.1);
            border: 1px solid var(--border-gold);
            color: var(--gold-bright);
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .hero h1 span {
            color: var(--gold-bright);
        }

        .hero p {
            color: var(--text-soft);
            margin-bottom: 24px;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 14px;
        }

        .stat-box strong {
            display: block;
            color: var(--gold-bright);
            font-size: 1.25rem;
        }

        .stat-box span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .booking-card {
            background: linear-gradient(160deg, rgba(17, 24, 39, 0.96), rgba(9, 13, 24, 0.98));
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-xl);
            padding: 26px;
            box-shadow: var(--glow-gold);
        }

        .mode-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(5,7,13,0.8);
            padding: 6px;
            border-radius: 12px;
            margin: 14px 0 16px;
        }

        .mode-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 9px 6px;
            border-radius: 9px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #f5b942, #d98a1c);
            color: #080b12;
        }

        .dark-form { display: flex; flex-direction: column; gap: 13px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 0.78rem; color: var(--text-soft); font-weight: 600; }
        .field input, .field select {
            width: 100%;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(5,7,13,0.85);
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .price-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 11px;
            background: rgba(245,185,66,0.08);
            border: 1px dashed var(--border-gold);
        }

        .price-banner strong { color: var(--gold-bright); font-size: 1.1rem; }

        .section { padding: 82px 0; border-bottom: 1px solid var(--border-subtle); }
        .section-head { text-align: center; max-width: 680px; margin: 0 auto 44px; }
        .section-head h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin: 6px 0 10px; }
        .section-head p { color: var(--text-muted); }

        .pillars-grid, .fleet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
        }

        .card.featured { border-color: var(--gold-bright); box-shadow: var(--glow-gold); }
        .card h3 { font-size: 1.15rem; margin-bottom: 8px; }
        .card p { font-size: 0.88rem; color: var(--text-muted); }

        .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
        .filter-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-soft);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--gold-bright);
            color: #080b12;
            border-color: var(--gold-bright);
        }

        .calc-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            background: var(--bg-surface);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-xl);
            padding: 28px;
        }

        .calc-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .footer { background: #030509; padding: 52px 0 24px; }
        .footer-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .footer ul { list-style: none; display: flex; flex-direction: column; gap: 8px; color: var(--text-muted); font-size: 0.88rem; }
        .footer a { color: var(--text-muted); text-decoration: none; }
        .footer a:hover { color: var(--gold-bright); }
        .footer-copy { text-align: center; padding-top: 18px; color: #64748b; font-size: 0.8rem; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: rgba(2,4,10,0.82);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-dialog {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: var(--bg-surface);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-xl);
            padding: 26px;
        }
        .modal-x {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 960px) {
            .hero-grid, .pillars-grid, .fleet-grid, .calc-box, .footer-grid { grid-template-columns: 1fr; }
            .nav-menu {
                display: none;
                position: absolute;
                top: 76px;
                left: 0;
                width: 100%;
                background: #070a13;
                flex-direction: column;
                padding: 20px;
                gap: 14px;
                border-bottom: 1px solid var(--border-subtle);
            }
            .nav-menu.open { display: flex; }
            .hamburger { display: inline-flex; align-items: center; justify-content: center; }
        }

        @media (max-width: 600px) {
            .field-row, .mode-tabs, .hero-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="bg-grid-pattern">

        <div class="container parent-sub-inner">

                <span>🏛️</span>
